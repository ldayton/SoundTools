name: Browser test environment
description: Install the selected browser and provide Firefox with a clocked audio device.
inputs:
  browser:
    description: chromium, firefox or webkit
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        TEST_ENGINE: ${{ inputs.browser }}
      run: bash scripts/install-ci-browser.sh "$TEST_ENGINE"
    - if: inputs.browser == 'firefox'
      shell: bash
      run: |
        sudo apt-get install -y pulseaudio pulseaudio-utils
        pulseaudio --start --exit-idle-time=-1
        pactl load-module module-null-sink sink_name=ci_audio rate=48000 channels=2
        pactl set-default-sink ci_audio
        pactl info
