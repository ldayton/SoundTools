name: Restore validated build
description: Restore an app bundle and reject artifacts from another commit or configuration.
inputs:
  app:
    required: true
    description: App whose build is needed.
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@v4
      with:
        name: build-${{ inputs.app }}
        path: work/ci-build
    - shell: bash
      env:
        BUILD_APP: ${{ inputs.app }}
      run: |
        tar -xzf "work/ci-build/$BUILD_APP.tar.gz"
        node scripts/ci/build.cjs verify "$BUILD_APP"
