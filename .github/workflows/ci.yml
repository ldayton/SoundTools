name: CI
on:
  workflow_dispatch:
  schedule:
    - cron: "20 3 * * *"
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
  actions: read
jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      apps: ${{ steps.changes.outputs.apps }}
      builds: ${{ steps.changes.outputs.builds }}
      deploy: ${{ steps.changes.outputs.deploy }}
      accounts: ${{ steps.changes.outputs.accounts }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - id: changes
        run: node scripts/ci/affected.cjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
  shared:
    concurrency:
      group: validation-${{ github.event_name }}-${{ github.ref }}-shared
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify:history
      - run: npm run build:shared -- diagnostics
      - run: npm run test:shared
      - run: node --test tests/ci/*.test.cjs
  build:
    name: build (${{ matrix.app }})
    needs: [changes, shared]
    if: needs.changes.outputs.builds != '[]'
    concurrency:
      group: validation-${{ github.event_name }}-${{ github.ref }}-build-${{ matrix.app }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.builds) }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Fast app unit tests
        if: matrix.app != 'soundglow'
        run: npm test --workspace=${{ matrix.app }}
      - run: npm run build:ci -- ${{ matrix.app }}
      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.app }}
          path: work/ci-build/${{ matrix.app }}.tar.gz
          compression-level: 0
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-failure-${{ matrix.app }}
          path: work/ci-provenance/
          retention-days: 7

  dorego:
    concurrency:
      group: validation-${{ github.event_name }}-${{ github.ref }}-dorego-${{ matrix.browser }}
      cancel-in-progress: true
    needs: [changes, build]
    if: contains(fromJSON(needs.changes.outputs.apps), 'dorego')
    name: dorego (${{ matrix.browser }})
    env:
      CI_USE_BUILD: "1"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/build
        with:
          app: dorego
      - uses: ./.github/actions/browser
        with:
          browser: ${{ matrix.browser }}
      - run: npm run test:layout --workspace=dorego -- dist-pages
        env:
          TEST_BROWSER: ${{ matrix.browser }}
      - run: npm run test:render-recovery
        if: matrix.browser == 'chromium'
      - run: npm run test:diagnostics-ui --workspace=dorego
        if: matrix.browser == 'chromium'
      - run: npm run test:browser --workspace=@ldayton/browser-diagnostics
        env:
          TEST_BROWSER: ${{ matrix.browser }}
      - run: npm run test:browsers --workspace=dorego
        env:
          TEST_BROWSERS: ${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: matrix.browser == 'chromium'
        with:
          name: dorego-source-maps
          path: apps/dorego/dist-pages/assets/*.map
          retention-days: 14
      - run: npm run test:resilience --workspace=dorego
        if: matrix.browser == 'chromium'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: dorego-browser-results-${{ matrix.browser }}
          path: |
            apps/dorego/work/
            work/resilience-dorego/
  soundglow:
    concurrency:
      group: validation-${{ github.event_name }}-${{ github.ref }}-soundglow
      cancel-in-progress: true
    needs: [changes, build]
    if: contains(fromJSON(needs.changes.outputs.apps), 'soundglow')
    env:
      CI_USE_BUILD: "1"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/build
        with:
          app: soundglow
      - uses: ./.github/actions/browser
        with:
          browser: chromium
      - run: npm run test:core --workspace=soundglow
      - run: npm run test:updates --workspace=soundglow
      - run: npm run test:resilience --workspace=soundglow
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: soundglow-browser-results
          path: |
            apps/soundglow/test-results/
            apps/soundglow/playwright-report/
            work/resilience-soundglow/

  soundglow-visual:
    name: soundglow visual (${{ matrix.shard }}/3)
    needs: [changes, build]
    if: contains(fromJSON(needs.changes.outputs.apps), 'soundglow')
    concurrency:
      group: validation-${{ github.event_name }}-${{ github.ref }}-soundglow-visual-${{ matrix.shard }}
      cancel-in-progress: true
    env:
      CI_USE_BUILD: "1"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/build
        with:
          app: soundglow
      - uses: ./.github/actions/browser
        with:
          browser: chromium
      - run: npm run test:visual --workspace=soundglow -- --shard=${{ matrix.shard }}/3
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: soundglow-visual-${{ matrix.shard }}
          path: |
            apps/soundglow/test-results/
            apps/soundglow/playwright-report/
          retention-days: 7

  soundglow-ui:
    concurrency:
      group: validation-${{ github.event_name }}-${{ github.ref }}-soundglow-ui-${{ matrix.browser }}
      cancel-in-progress: true
    needs: [changes, build]
    if: contains(fromJSON(needs.changes.outputs.apps), 'soundglow')
    name: soundglow UI (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    env:
      CI_USE_BUILD: "1"
      SOUNDGLOW_TEST_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/build
        with:
          app: soundglow
      - uses: ./.github/actions/browser
        with:
          browser: ${{ matrix.browser }}
      - run: npm run test:ui-browsers --workspace=soundglow
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: soundglow-ui-results-${{ matrix.browser }}
          path: |
            apps/soundglow/test-results/

  notewise:
    concurrency:
      group: validation-${{ github.event_name }}-${{ github.ref }}-notewise-${{ matrix.browser }}
      cancel-in-progress: true
    needs: [changes, build]
    if: contains(fromJSON(needs.changes.outputs.apps), 'notewise')
    name: notewise (${{ matrix.browser }})
    env:
      CI_USE_BUILD: "1"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/build
        with:
          app: notewise
      - uses: ./.github/actions/browser
        with:
          browser: ${{ matrix.browser }}
      - run: npm run test:layout --workspace=notewise
        env:
          TEST_BROWSER: ${{ matrix.browser }}
      - run: npm run test:workspace --workspace=notewise
        env:
          TEST_BROWSER: ${{ matrix.browser }}
      - run: npm run test:browser --workspace=notewise
        if: matrix.browser == 'chromium'
      - run: npm run test:guitar --workspace=notewise
        env:
          TEST_BROWSER: ${{ matrix.browser }}
      - run: npm run test:piano --workspace=notewise
        env:
          TEST_BROWSER: ${{ matrix.browser }}
      - run: npm run test:piano-audio --workspace=notewise
        if: matrix.browser == 'chromium'
      - run: npm run test:practice --workspace=notewise
        env:
          TEST_BROWSER: ${{ matrix.browser }}
      - run: npm run test:theory --workspace=notewise
        env:
          TEST_BROWSER: ${{ matrix.browser }}
      - run: npm run test:navigation --workspace=notewise
        env:
          TEST_BROWSER: ${{ matrix.browser }}
      - run: npm run test:midi --workspace=notewise
        env:
          TEST_BROWSER: ${{ matrix.browser }}
      - run: npm run test:signatures --workspace=notewise
        env:
          TEST_BROWSER: ${{ matrix.browser }}
      - run: npm run test:offline --workspace=notewise
        env:
          TEST_BROWSER: ${{ matrix.browser }}
      - run: npm run test:diagnostics --workspace=notewise
        if: matrix.browser == 'chromium'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: notewise-browser-results-${{ matrix.browser }}
          path: |
            apps/notewise/work/
            work/piano-*.png
            work/midi-*.png
            work/key-signatures-*.png


  notewise-backing:
    name: notewise backing (${{ matrix.browser }})
    needs: [changes, build]
    if: contains(fromJSON(needs.changes.outputs.apps), 'notewise')
    concurrency:
      group: validation-${{ github.event_name }}-${{ github.ref }}-notewise-backing-${{ matrix.browser }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      CI_USE_BUILD: "1"
      TEST_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/build
        with:
          app: notewise
      - uses: ./.github/actions/browser
        with:
          browser: ${{ matrix.browser }}
      - run: npm run test:backing --workspace=notewise
      - run: npm run test:backing-realism --workspace=notewise
        if: matrix.browser == 'chromium'
      - run: npm run test:backing-genres --workspace=notewise
        if: matrix.browser == 'chromium'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: notewise-backing-${{ matrix.browser }}
          path: apps/notewise/work/
          retention-days: 7

  songalong:
    concurrency:
      group: validation-${{ github.event_name }}-${{ github.ref }}-songalong-${{ matrix.browser }}
      cancel-in-progress: true
    needs: [changes, build]
    if: contains(fromJSON(needs.changes.outputs.apps), 'songalong')
    name: songalong (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      CI_USE_BUILD: "1"
      TEST_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/build
        with:
          app: songalong
      - uses: ./.github/actions/build
        with:
          app: notewise
      - uses: ./.github/actions/browser
        with:
          browser: ${{ matrix.browser }}
      - run: npm run test:layout --workspace=songalong
      - run: npm run test:split --workspace=songalong
      - run: npm run test:sidebars --workspace=songalong
      - run: npm run test:hymn-keys --workspace=songalong
      - run: npm run test:stanzas --workspace=songalong
      - run: npm run test:hymn-playback --workspace=songalong
      - run: npm run test:sight --workspace=songalong
      - run: npm run test:fingerings --workspace=songalong
      - run: npm run test:offline --workspace=songalong
      - run: npm run test:diagnostics --workspace=songalong
        if: matrix.browser == 'chromium'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: songalong-browser-results-${{ matrix.browser }}
          path: |
            apps/songalong/work/
            work/browser-results/
          retention-days: 7

  songalong-catalog:
    name: songalong catalog (${{ matrix.browser }}, ${{ matrix.shard }}/3)
    needs: [changes, build]
    if: contains(fromJSON(needs.changes.outputs.apps), 'songalong')
    concurrency:
      group: validation-${{ github.event_name }}-${{ github.ref }}-songalong-catalog-${{ matrix.browser }}-${{ matrix.shard }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        shard: [1, 2, 3]
    env:
      CI_USE_BUILD: "1"
      TEST_BROWSER: ${{ matrix.browser }}
      TEST_SHARD: ${{ matrix.shard }}/3
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/build
        with:
          app: songalong
      - uses: ./.github/actions/browser
        with:
          browser: ${{ matrix.browser }}
      - run: npm run test:catalog --workspace=songalong
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: songalong-catalog-${{ matrix.browser }}-${{ matrix.shard }}
          path: apps/songalong/work/
          retention-days: 7

  accounts:
    concurrency:
      group: validation-${{ github.event_name }}-${{ github.ref }}-accounts-${{ matrix.browser }}
      cancel-in-progress: true
    needs: changes
    if: needs.changes.outputs.accounts == 'true'
    name: accounts (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      TEST_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 3.2.0
      - run: npm ci
      - uses: ./.github/actions/browser
        with:
          browser: ${{ matrix.browser }}
      - run: node scripts/ci/infrastructure.cjs supabase start --runtime docker --exclude functions,studio,analytics,pooler,realtime --eager
      - run: supabase db push
      - run: node scripts/setup-account-local.mjs
      - run: npm run test:accounts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: accounts-results-${{ matrix.browser }}
          path: |
            work/account-*.png
            work/cloud-files-*.png
            work/browser-results/

  gate:
    name: validation gate
    if: always() && !contains(needs.*.result, 'cancelled')
    needs: [changes, shared, build, dorego, notewise, notewise-backing, songalong, songalong-catalog, soundglow, soundglow-visual, soundglow-ui, accounts]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - run: node scripts/ci/gate.cjs
        env:
          CI_JOB_RESULTS: ${{ toJSON(needs) }}

  release:
    name: release (${{ matrix.app }})
    needs: [changes, gate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.deploy != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.deploy) }}
    environment:
      name: production-${{ matrix.app }}
      url: ${{ steps.release.outputs.origin }}
    concurrency:
      group: production-${{ matrix.app }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - uses: ./.github/actions/browser
        with:
          browser: chromium
      - run: node tests/ci/protected-stage.browser.cjs
      - id: release
        run: node scripts/ci/release.cjs ${{ matrix.app }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          RELEASE_BROWSER_SMOKE: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: production-check-${{ matrix.app }}
          path: work/browser-results/
          retention-days: 7
