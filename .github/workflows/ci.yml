name: CI
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "20 3 * * *"
  workflow_dispatch:
    inputs:
      full:
        description: Run exhaustive regression suites (never publishes)
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      apps: ${{ steps.changes.outputs.apps }}
      deploy: ${{ steps.changes.outputs.deploy }}
      accounts: ${{ steps.changes.outputs.accounts }}
      matrices: ${{ steps.changes.outputs.matrices }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - id: changes
        run: node scripts/ci/affected.cjs
        env:
          CI_FULL: ${{ inputs.full == true }}
  shared:
    concurrency:
      group: validation-${{ github.event_name }}-${{ github.ref }}-shared
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/ci/run-shared.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: timings-shared-attempt${{ github.run_attempt }}
          path: work/ci-results/
          retention-days: 7

  dorego:
    needs: [changes]
    if: contains(fromJSON(needs.changes.outputs.apps), 'dorego')
    uses: ./.github/workflows/validate-app.yml
    with:
      app: dorego
      matrix: ${{ toJSON(fromJSON(needs.changes.outputs.matrices).dorego) }}

  notewise:
    needs: [changes]
    if: contains(fromJSON(needs.changes.outputs.apps), 'notewise')
    uses: ./.github/workflows/validate-app.yml
    with:
      app: notewise
      matrix: ${{ toJSON(fromJSON(needs.changes.outputs.matrices).notewise) }}

  songalong:
    needs: [changes]
    if: contains(fromJSON(needs.changes.outputs.apps), 'songalong')
    uses: ./.github/workflows/validate-app.yml
    with:
      app: songalong
      matrix: ${{ toJSON(fromJSON(needs.changes.outputs.matrices).songalong) }}

  soundglow:
    needs: [changes]
    if: contains(fromJSON(needs.changes.outputs.apps), 'soundglow')
    uses: ./.github/workflows/validate-app.yml
    with:
      app: soundglow
      matrix: ${{ toJSON(fromJSON(needs.changes.outputs.matrices).soundglow) }}

  accounts:
    needs: changes
    if: needs.changes.outputs.accounts == 'true'
    concurrency:
      group: validation-${{ github.event_name }}-${{ github.ref }}-accounts-${{ matrix.browser }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ fromJSON((github.event_name == 'schedule' || inputs.full == true) && '["chromium","webkit"]' || '["chromium"]') }}
    env:
      TEST_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 3.2.0
      - run: npm ci
      - uses: ./.github/actions/browser
        with:
          browser: ${{ matrix.browser }}
      - run: node scripts/ci/infrastructure.cjs supabase start --runtime docker --exclude functions,studio,analytics,pooler --eager
      - run: supabase db push
      - run: node scripts/setup-account-local.mjs
      - run: npm run test:accounts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accounts-results-${{ matrix.browser }}
          path: |
            work/ci-results/
            work/account-*.png
            work/cloud-files-*.png
            work/browser-results/

  gate:
    name: validation gate
    if: always() && !contains(needs.*.result, 'cancelled')
    needs: [changes, shared, dorego, notewise, songalong, soundglow, accounts]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - run: node scripts/ci/gate.cjs
        env:
          CI_JOB_RESULTS: ${{ toJSON(needs) }}

  release-dorego:
    needs: [changes, shared, dorego, accounts]
    if: >-
      always() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.changes.result == 'success' && needs.shared.result == 'success' && needs.dorego.result == 'success' &&
      (needs.accounts.result == 'success' ||
      (needs.changes.outputs.accounts != 'true' && needs.accounts.result == 'skipped')) &&
      contains(fromJSON(needs.changes.outputs.deploy || '[]'), 'dorego')
    uses: ./.github/workflows/release-app.yml
    with:
      app: dorego
    secrets: inherit

  release-notewise:
    needs: [changes, shared, notewise, accounts]
    if: >-
      always() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.changes.result == 'success' && needs.shared.result == 'success' && needs.notewise.result == 'success' &&
      (needs.accounts.result == 'success' ||
      (needs.changes.outputs.accounts != 'true' && needs.accounts.result == 'skipped')) &&
      contains(fromJSON(needs.changes.outputs.deploy || '[]'), 'notewise')
    uses: ./.github/workflows/release-app.yml
    with:
      app: notewise
    secrets: inherit

  release-songalong:
    needs: [changes, shared, songalong, accounts]
    if: >-
      always() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.changes.result == 'success' && needs.shared.result == 'success' && needs.songalong.result == 'success' &&
      (needs.accounts.result == 'success' ||
      (needs.changes.outputs.accounts != 'true' && needs.accounts.result == 'skipped')) &&
      contains(fromJSON(needs.changes.outputs.deploy || '[]'), 'songalong')
    uses: ./.github/workflows/release-app.yml
    with:
      app: songalong
    secrets: inherit

  release-soundglow:
    needs: [changes, shared, soundglow, accounts]
    if: >-
      always() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.changes.result == 'success' && needs.shared.result == 'success' && needs.soundglow.result == 'success' &&
      (needs.accounts.result == 'success' ||
      (needs.changes.outputs.accounts != 'true' && needs.accounts.result == 'skipped')) &&
      contains(fromJSON(needs.changes.outputs.deploy || '[]'), 'soundglow')
    uses: ./.github/workflows/release-app.yml
    with:
      app: soundglow
    secrets: inherit
