name: CI
on:
  workflow_dispatch:
  schedule:
    - cron: "20 3 * * *"
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
  actions: read
jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      apps: ${{ steps.changes.outputs.apps }}
      deploy: ${{ steps.changes.outputs.deploy }}
      accounts: ${{ steps.changes.outputs.accounts }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - id: changes
        run: node scripts/ci/affected.cjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
  shared:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify:history
      - run: npm run build:shared
      - run: npm run test:shared
      - run: node --test tests/ci/*.test.cjs
  dorego:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.apps), 'dorego')
    name: dorego (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: bash scripts/install-ci-browser.sh ${{ matrix.browser }}
      - name: Provide a clocked audio output for Firefox
        if: matrix.browser == 'firefox'
        run: |
          sudo apt-get update
          sudo apt-get install -y pulseaudio pulseaudio-utils
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=ci_audio rate=48000 channels=2
          pactl set-default-sink ci_audio
          pactl info
          node scripts/check-audio-device.cjs
      - run: npm run build:shared
      - run: npm test --workspace=dorego
        if: matrix.browser == 'chromium'
      - run: npm run build:pages --workspace=dorego
      - run: npm run test:layout --workspace=dorego -- dist-pages
        env:
          TEST_BROWSER: ${{ matrix.browser }}
      - run: npm run test:render-recovery
        if: matrix.browser == 'chromium'
      - run: npm run test:diagnostics-ui --workspace=dorego
        if: matrix.browser == 'chromium'
      - run: npm run test:browser --workspace=@ldayton/browser-diagnostics
        env:
          TEST_BROWSER: ${{ matrix.browser }}
      - run: npm run test:browsers --workspace=dorego
        env:
          TEST_BROWSERS: ${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: matrix.browser == 'chromium'
        with:
          name: dorego-source-maps
          path: apps/dorego/dist-pages/assets/*.map
          retention-days: 14
      - run: npm run test:resilience --workspace=dorego
        if: matrix.browser == 'chromium'
      - run: npm run build:dorego
        if: matrix.browser == 'chromium'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: dorego-browser-results-${{ matrix.browser }}
          path: |
            apps/dorego/work/
            work/resilience-dorego/
  soundglow:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.apps), 'soundglow')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: bash scripts/install-ci-browser.sh chromium
      - run: npm run build:shared
      - run: npm run test:soundglow
      - run: npm run test:resilience --workspace=soundglow
      - run: npm run build:soundglow
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: soundglow-browser-results
          path: |
            apps/soundglow/test-results/
            apps/soundglow/playwright-report/
            work/resilience-soundglow/

  soundglow-ui:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.apps), 'soundglow')
    name: soundglow UI (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    env:
      SOUNDGLOW_TEST_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: bash scripts/install-ci-browser.sh ${{ matrix.browser }}
      - name: Start virtual audio output for Firefox
        if: matrix.browser == 'firefox'
        run: |
          sudo apt-get update
          sudo apt-get install -y pulseaudio pulseaudio-utils
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=ci_audio rate=48000 channels=2
          pactl set-default-sink ci_audio
      - run: npm run build:shared
      - run: npm run test:ui-browsers --workspace=soundglow
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: soundglow-ui-results-${{ matrix.browser }}
          path: |
            apps/soundglow/test-results/

  notewise:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.apps), 'notewise')
    name: notewise (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: bash scripts/install-ci-browser.sh ${{ matrix.browser }}
      - name: Start virtual audio output for Firefox
        if: matrix.browser == 'firefox'
        run: |
          sudo apt-get update
          sudo apt-get install -y pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=ci_audio
          pactl set-default-sink ci_audio
          pactl info
      - run: npm test --workspace=notewise
        if: matrix.browser == 'chromium'
      - run: npm run build --workspace=notewise
      - run: npm run test:layout --workspace=notewise
        env:
          TEST_BROWSER: ${{ matrix.browser }}
      - run: npm run test:workspace --workspace=notewise
        env:
          TEST_BROWSER: ${{ matrix.browser }}
      - run: npm run test:browser --workspace=notewise
        if: matrix.browser == 'chromium'
      - run: npm run test:guitar --workspace=notewise
        env:
          TEST_BROWSER: ${{ matrix.browser }}
      - run: npm run test:piano --workspace=notewise
        env:
          TEST_BROWSER: ${{ matrix.browser }}
      - run: npm run test:piano-audio --workspace=notewise
        if: matrix.browser == 'chromium'
      - run: npm run test:practice --workspace=notewise
        env:
          TEST_BROWSER: ${{ matrix.browser }}
      - run: npm run test:theory --workspace=notewise
        env:
          TEST_BROWSER: ${{ matrix.browser }}
      - run: npm run test:navigation --workspace=notewise
        env:
          TEST_BROWSER: ${{ matrix.browser }}
      - run: npm run test:midi --workspace=notewise
        env:
          TEST_BROWSER: ${{ matrix.browser }}
      - run: npm run test:signatures --workspace=notewise
        env:
          TEST_BROWSER: ${{ matrix.browser }}
      - run: npm run test:offline --workspace=notewise
        env:
          TEST_BROWSER: ${{ matrix.browser }}
      - run: npm run test:diagnostics --workspace=notewise
        if: matrix.browser == 'chromium'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: notewise-browser-results-${{ matrix.browser }}
          path: |
            apps/notewise/work/
            work/piano-*.png
            work/midi-*.png
            work/key-signatures-*.png

  songalong:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.apps), 'songalong')
    name: songalong (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      TEST_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: bash scripts/install-ci-browser.sh ${{ matrix.browser }}
      - name: Start virtual audio output for Firefox
        if: matrix.browser == 'firefox'
        run: |
          sudo apt-get update
          sudo apt-get install -y pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=ci_audio
          pactl set-default-sink ci_audio
      - run: npm test --workspace=songalong
        if: matrix.browser == 'chromium'
      - run: npm run build --workspace=songalong
      - run: npm run build --workspace=notewise
      - run: npm run test:layout --workspace=songalong
      - run: npm run test:split --workspace=songalong
      - run: npm run test:sidebars --workspace=songalong
      - run: npm run test:hymn-keys --workspace=songalong
      - run: npm run test:stanzas --workspace=songalong
      - run: npm run test:hymn-playback --workspace=songalong
      - run: npm run test:sight --workspace=songalong
      - run: npm run test:offline --workspace=songalong
      - run: npm run test:diagnostics --workspace=songalong
        if: matrix.browser == 'chromium'

  accounts:
    needs: changes
    if: needs.changes.outputs.accounts == 'true'
    name: accounts (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      TEST_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 3.2.0
      - run: npm ci
      - run: bash scripts/install-ci-browser.sh ${{ matrix.browser }}
      - run: supabase start --runtime docker --exclude functions,studio,analytics,pooler,realtime --eager
      - run: supabase db push
      - run: node scripts/setup-account-local.mjs
      - run: npm run test:accounts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: accounts-results-${{ matrix.browser }}
          path: |
            work/account-*.png
            work/cloud-files-*.png

  gate:
    name: validation gate
    if: always()
    needs: [changes, shared, dorego, notewise, songalong, soundglow, soundglow-ui, accounts]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - run: node scripts/ci/gate.cjs
        env:
          CI_JOB_RESULTS: ${{ toJSON(needs) }}

  release:
    name: release (${{ matrix.app }})
    needs: [changes, gate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.deploy != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.deploy) }}
    environment: production-${{ matrix.app }}
    concurrency:
      group: production-${{ matrix.app }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - run: node scripts/ci/release.cjs ${{ matrix.app }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
