name: CI
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  shared:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify:history
      - run: npm run build:shared
      - run: npm run test:shared
  dorego:
    name: dorego (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Provide a clocked audio output for Firefox
        if: matrix.browser == 'firefox'
        run: |
          sudo apt-get update
          sudo apt-get install -y pulseaudio pulseaudio-utils
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=ci_audio rate=48000 channels=2
          pactl set-default-sink ci_audio
          pactl info
          node scripts/check-audio-device.cjs
      - run: npm run build:shared
      - run: npm test --workspace=dorego
        if: matrix.browser == 'chromium'
      - run: npm run build:pages --workspace=dorego
      - run: npm run test:layout --workspace=dorego -- dist-pages
        env:
          TEST_BROWSER: ${{ matrix.browser }}
      - run: npm run test:diagnostics-ui --workspace=dorego
        if: matrix.browser == 'chromium'
      - run: npm run test:browser --workspace=@ldayton/browser-diagnostics
        env:
          TEST_BROWSER: ${{ matrix.browser }}
      - run: npm run test:browsers --workspace=dorego
        env:
          TEST_BROWSERS: ${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: matrix.browser == 'chromium'
        with:
          name: dorego-source-maps
          path: apps/dorego/dist-pages/assets/*.map
          retention-days: 14
      - run: npm run test:resilience --workspace=dorego
        if: matrix.browser == 'chromium'
      - run: npm run build:dorego
        if: matrix.browser == 'chromium'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: dorego-browser-results-${{ matrix.browser }}
          path: |
            apps/dorego/work/
            work/resilience-dorego/
  soundglow:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build:shared
      - run: npm run test:soundglow
      - run: npm run test:resilience --workspace=soundglow
      - run: npm run build:soundglow
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: soundglow-browser-results
          path: |
            apps/soundglow/test-results/
            apps/soundglow/playwright-report/
            work/resilience-soundglow/

  notewise:
    name: notewise (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Start virtual audio output for Firefox
        if: matrix.browser == 'firefox'
        run: |
          sudo apt-get update
          sudo apt-get install -y pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=ci_audio
          pactl set-default-sink ci_audio
          pactl info
      - run: npm test --workspace=notewise
        if: matrix.browser == 'chromium'
      - run: npm run build --workspace=notewise
      - run: npm run test:layout --workspace=notewise
        env:
          TEST_BROWSER: ${{ matrix.browser }}
      - run: npm run test:browser --workspace=notewise
        if: matrix.browser == 'chromium'
      - run: npm run test:guitar --workspace=notewise
        env:
          TEST_BROWSER: ${{ matrix.browser }}
      - run: npm run test:piano --workspace=notewise
        env:
          TEST_BROWSER: ${{ matrix.browser }}
      - run: npm run test:piano-audio --workspace=notewise
        if: matrix.browser == 'chromium'
      - run: npm run test:practice --workspace=notewise
        env:
          TEST_BROWSER: ${{ matrix.browser }}
      - run: npm run test:theory --workspace=notewise
        env:
          TEST_BROWSER: ${{ matrix.browser }}
      - run: npm run test:navigation --workspace=notewise
        env:
          TEST_BROWSER: ${{ matrix.browser }}
      - run: npm run test:midi --workspace=notewise
        env:
          TEST_BROWSER: ${{ matrix.browser }}
      - run: npm run test:signatures --workspace=notewise
        env:
          TEST_BROWSER: ${{ matrix.browser }}
      - run: npm run test:offline --workspace=notewise
        env:
          TEST_BROWSER: ${{ matrix.browser }}
      - run: npm run test:diagnostics --workspace=notewise
        if: matrix.browser == 'chromium'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: notewise-browser-results-${{ matrix.browser }}
          path: |
            apps/notewise/work/
            work/piano-*.png
            work/midi-*.png
            work/key-signatures-*.png

  songalong:
    name: songalong (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      TEST_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Start virtual audio output for Firefox
        if: matrix.browser == 'firefox'
        run: |
          sudo apt-get update
          sudo apt-get install -y pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=ci_audio
          pactl set-default-sink ci_audio
      - run: npm test --workspace=songalong
        if: matrix.browser == 'chromium'
      - run: npm run build --workspace=songalong
      - run: npm run build --workspace=notewise
      - run: npm run test:layout --workspace=songalong
      - run: npm run test:split --workspace=songalong
      - run: npm run test:sidebars --workspace=songalong
      - run: npm run test:hymn-keys --workspace=songalong
      - run: npm run test:hymn-playback --workspace=songalong
      - run: npm run test:sight --workspace=songalong
      - run: npm run test:offline --workspace=songalong
      - run: npm run test:diagnostics --workspace=songalong
        if: matrix.browser == 'chromium'
