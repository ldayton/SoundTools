name: Deploy DoReGo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:pages
        env:
          VITE_SENTRY_DSN: ${{ vars.DOREGO_SENTRY_DSN }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:diagnostics-ui
      - run: npm run test:pages
      - run: npm run test:offline
      - name: Save source maps for debugging
        uses: actions/upload-artifact@v4
        with:
          name: dorego-source-maps
          path: dist-pages/assets/*.map
          retention-days: 14
      - name: Exclude source maps from the public site
        run: find dist-pages -name '*.map' -delete
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/deploy-pages@v5.0.1
        id: deployment
