name: Validate app
on:
  workflow_call:
    inputs:
      app:
        required: true
        type: string
      full:
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  validate:
    name: ${{ inputs.app }} (${{ matrix.browser }}, ${{ inputs.full && 'regression' || 'focused' }})
    concurrency:
      group: validation-${{ github.event_name }}-${{ github.ref }}-${{ inputs.app }}-${{ matrix.browser }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.full && 30 || 10 }}
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ fromJSON(inputs.full && '["chromium","webkit"]' || '["chromium"]') }}
    env:
      TEST_BROWSER: ${{ matrix.browser }}
      TEST_BROWSERS: ${{ matrix.browser }}
      SOUNDGLOW_TEST_BROWSER: ${{ matrix.browser }}
      CI_USE_BUILD: "1"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/browser
        with:
          browser: ${{ matrix.browser }}
      - uses: ./.github/actions/browser
        if: ${{ !inputs.full }}
        with:
          browser: webkit
      - run: node scripts/ci/check-app.cjs ${{ inputs.app }} ${{ inputs.full && 'regression' || 'focused' }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: failure-${{ inputs.app }}-${{ matrix.browser }}
          path: |
            apps/${{ inputs.app }}/work/
            apps/${{ inputs.app }}/test-results/
            apps/${{ inputs.app }}/playwright-report/
            work/browser-results/
          retention-days: 7
