name: Validate app
on:
  workflow_call:
    inputs:
      app:
        required: true
        type: string
      full:
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  strategy:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.strategy.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - id: strategy
        run: node scripts/ci/test-strategy.cjs matrix ${{ inputs.app }} ${{ inputs.full && 'regression' || 'focused' }}
  validate:
    needs: strategy
    name: ${{ inputs.app }} (${{ matrix.browser }}, ${{ matrix.profile }})
    concurrency:
      group: validation-${{ github.event_name }}-${{ github.ref }}-${{ inputs.app }}-${{ matrix.browser }}-${{ matrix.profile }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.strategy.outputs.matrix) }}
    env:
      TEST_BROWSER: ${{ matrix.browser }}
      TEST_BROWSERS: ${{ matrix.browser }}
      SOUNDGLOW_TEST_BROWSER: ${{ matrix.browser }}
      CI_USE_BUILD: "1"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/browser
        with:
          browser: ${{ matrix.browser }}
      - uses: ./.github/actions/browser
        if: ${{ matrix.profile == 'focused' }}
        with:
          browser: webkit
      - run: node scripts/ci/check-app.cjs ${{ inputs.app }} ${{ matrix.profile }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: timings-${{ inputs.app }}-${{ matrix.browser }}-${{ matrix.profile }}-attempt${{ github.run_attempt }}
          path: work/ci-results/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: failure-${{ inputs.app }}-${{ matrix.browser }}-${{ matrix.profile }}-attempt${{ github.run_attempt }}
          path: |
            apps/${{ inputs.app }}/work/
            apps/${{ inputs.app }}/test-results/
            apps/${{ inputs.app }}/playwright-report/
            work/browser-results/
          retention-days: 7
