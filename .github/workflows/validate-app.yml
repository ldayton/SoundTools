name: Validate app
on:
  workflow_call:
    inputs:
      app:
        required: true
        type: string
      matrix:
        required: true
        type: string
permissions:
  contents: read
jobs:
  validate:
    name: ${{ inputs.app }} (${{ matrix.tier }}, ${{ matrix.group }}, ${{ matrix.browser }}, part ${{ matrix.shard }}/${{ matrix.shards }})
    concurrency:
      group: validation-${{ github.event_name }}-${{ github.ref }}-${{ inputs.app }}-${{ matrix.tier }}-${{ matrix.browser }}-${{ matrix.group }}-${{ matrix.shard }}-of-${{ matrix.shards }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}
    env:
      TEST_BROWSER: ${{ matrix.browser }}
      TEST_BROWSERS: ${{ matrix.browser }}
      SOUNDGLOW_TEST_BROWSER: ${{ matrix.browser }}
      CI_USE_BUILD: "1"
      CI_TIER: ${{ matrix.tier }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/browser
        with:
          browser: ${{ matrix.browser }}
      - uses: ./.github/actions/browser
        if: ${{ matrix.tier == 'ci' && matrix.group == 'core' }}
        with:
          browser: webkit
      - run: node scripts/ci/check-app.cjs ${{ inputs.app }} ${{ matrix.tier }} ${{ matrix.group }} ${{ matrix.shard }}/${{ matrix.shards }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: timings-${{ inputs.app }}-${{ matrix.tier }}-${{ matrix.browser }}-${{ matrix.group }}-${{ matrix.shard }}-of-${{ matrix.shards }}-attempt${{ github.run_attempt }}
          path: work/ci-results/
          retention-days: 7
      - name: Package diagnostic failure evidence
        if: failure()
        run: node scripts/ci/failure-artifacts.cjs ${{ inputs.app }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: failure-${{ inputs.app }}-${{ matrix.tier }}-${{ matrix.browser }}-${{ matrix.group }}-${{ matrix.shard }}-of-${{ matrix.shards }}-attempt${{ github.run_attempt }}
          path: work/ci-failures/${{ inputs.app }}/
          retention-days: 7
