<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Guitar playback A/B</title>
<style>*{box-sizing:border-box}body{margin:0;padding:24px;background:#f4f5f1;color:#263329;font:16px system-ui,sans-serif}main{max-width:960px;margin:auto}h1{font-size:27px;margin:0 0 8px}p{color:#657064;margin:0 0 14px;line-height:1.5}a{color:#315d38}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:22px}.card{padding:20px;border:1px solid #d7ded3;background:white;border-radius:14px}h2{font-size:20px;margin:0 0 7px}.source{font-size:13px;min-height:36px;margin-bottom:14px}.buttons{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}button{flex:1;min-width:78px;border:1px solid #cbd4c7;background:#f5f7f3;border-radius:8px;padding:10px 7px;font:14px system-ui;cursor:pointer;color:inherit}button[aria-pressed=true]{background:#315e38;color:white;border-color:#315e38}.transport{display:flex;align-items:center;gap:8px}.transport button{flex:0 0 44px;min-width:44px;min-height:44px;padding:0;display:grid;place-items:center}.transport svg{width:20px;height:20px;pointer-events:none}.seek{width:100%;min-width:0;accent-color:#315e38}.time{font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}.volume{width:52px;min-width:38px;flex:0 1 52px;accent-color:#315e38}.status{min-height:18px}.seek,.volume{height:42px}small{display:block;color:#657064;margin-top:10px}.error{color:#a32d22}@media(max-width:420px){.transport{gap:6px}.volume{flex-basis:38px}}@media(max-width:700px){body{padding:16px}.grid{grid-template-columns:1fr}.card{padding:16px}}.mixer{margin-top:14px;border-top:1px solid #d7ded3;padding-top:12px}.mixer summary{cursor:pointer;min-height:36px;font-weight:600}.channels{display:grid;gap:14px;margin-top:8px}.channel{display:grid;grid-template-columns:minmax(0,1fr) 65px 60px;align-items:center;gap:4px 10px}.channel label{grid-column:1;font-size:14px}.channel output{grid-column:2;text-align:right;font-size:13px;font-variant-numeric:tabular-nums}.channel input{grid-column:1/3;grid-row:2;width:100%;height:38px;accent-color:#315e38;margin:0}.channel .mute{grid-column:3;grid-row:1/3;min-width:0;min-height:42px;padding:8px 4px;font-size:13px}.channel.absent{opacity:.45}.mixer-footer{display:flex;gap:12px;align-items:center;margin-top:15px}.mixer-footer button{flex:0 0 auto;font-size:13px;min-width:0}.mix-status{margin:0;font-size:12px}.export{flex:0 0 auto;margin-top:12px}.mixer small{line-height:1.4}</style>
<main><h1>Guitar playback A/B</h1><p>A · Before this workstream &nbsp; B · After. Loudness matched. Switch at the same moment while playing.</p><div class="grid" id="grid"></div><p id="error" role="alert"></p></main>
