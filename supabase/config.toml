#:schema https://supabase.com/schemas/config/v1.json
# Local test stack only. Hosted configuration is described in docs/accounts.md.
project_id = "SoundTools"
[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = 54322
shadow_port = 54320
major_version = 17
[db.seed]
enabled = false
[studio]
enabled = false
[realtime]
enabled = true
[storage]
enabled = true
file_size_limit = "50MiB"
[analytics]
enabled = false
[edge_runtime]
enabled = false
[local_smtp]
enabled = true
port = 54324
[auth]
enabled = true
site_url = "http://127.0.0.1:4391"
additional_redirect_urls = ["http://127.0.0.1:4317/auth/confirm", "http://127.0.0.1:4321/auth/confirm", "http://127.0.0.1:4391/auth/confirm", "http://127.0.0.1:4392/auth/confirm", "http://127.0.0.1:4393/auth/confirm", "http://127.0.0.1:4394/auth/confirm"]
enable_signup = false
enable_anonymous_sign_ins = false
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
[auth.email]
enabled = true
enable_confirmations = true
double_confirm_changes = true
secure_password_change = true
max_frequency = "1s"
otp_length = 6
otp_expiry = 1800
[auth.email.template.magic_link]
subject = '''{{ .Token }} — Sign in to {{ if or (eq .RedirectTo "https://dorego.lilydayton.me/auth/confirm") (eq .RedirectTo "https://dorego-soundtools.vercel.app/auth/confirm") (eq .RedirectTo "https://do-re-go.vercel.app/auth/confirm") (eq .RedirectTo "http://127.0.0.1:4391/auth/confirm") (eq .RedirectTo "http://localhost:4391/auth/confirm") (eq .RedirectTo "http://127.0.0.1:4317/auth/confirm") (eq .RedirectTo "http://localhost:4317/auth/confirm") }}DoReGo{{ else if or (eq .RedirectTo "https://songalong.lilydayton.me/auth/confirm") (eq .RedirectTo "https://songalong-soundtools.vercel.app/auth/confirm") (eq .RedirectTo "http://127.0.0.1:4392/auth/confirm") (eq .RedirectTo "http://localhost:4392/auth/confirm") (eq .RedirectTo "http://127.0.0.1:4321/auth/confirm") (eq .RedirectTo "http://localhost:4321/auth/confirm") }}SongAlong{{ else if or (eq .RedirectTo "https://notewise.lilydayton.me/auth/confirm") (eq .RedirectTo "https://note-by-note-seven.vercel.app/auth/confirm") (eq .RedirectTo "https://notewise-soundtools.vercel.app/auth/confirm") (eq .RedirectTo "http://127.0.0.1:4393/auth/confirm") (eq .RedirectTo "http://localhost:4393/auth/confirm") (eq .RedirectTo "http://127.0.0.1:4320/auth/confirm") (eq .RedirectTo "http://localhost:4320/auth/confirm") }}NoteWise{{ else if or (eq .RedirectTo "https://soundglow.lilydayton.me/auth/confirm") (eq .RedirectTo "https://soundglow-soundtools.vercel.app/auth/confirm") (eq .RedirectTo "http://127.0.0.1:4394/auth/confirm") (eq .RedirectTo "http://localhost:4394/auth/confirm") (eq .RedirectTo "http://127.0.0.1:8780/auth/confirm") (eq .RedirectTo "http://localhost:8780/auth/confirm") }}Soundglow{{ else }}your app{{ end }}'''
content_path = "./supabase/templates/magic-link.html"
[auth.rate_limit]
email_sent = 100
[experimental]
stack = true
