<!doctype html>
<html lang="en"><body>
  <h2>Sign in to SoundTools</h2>
  <p>Copy this code into the app:</p>
  <p style="font-size: 28px; font-weight: bold; letter-spacing: 4px">{{ .Token }}</p>
  <p>Or <a href="{{ .RedirectTo }}#token_hash={{ .TokenHash }}&amp;type=email">open the app to sign in</a>.</p>
  <p>This link and code are alternatives. Use either one, once. They expire in 30 minutes.</p>
  <p>If you did not request this email, you can ignore it.</p>
</body></html>
